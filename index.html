<title>BOB LA MOULA 24/24</title>

<style>
:root {
  --gold: #f5c542;
  --bg: #090909;
  --panel: #171717;
  --line: #333;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 24px 12px;
  background: #111;
  border-bottom: 1px solid var(--line);
}
.logo {
  margin: 0;
  color: var(--gold);
  font-size: clamp(28px, 7vw, 44px);
  font-weight: 900;
  letter-spacing: 2px;
}
nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  padding: 12px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 5;
}
button, a { cursor: pointer; }
nav button, .secondary {
  background: #171717;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 11px 13px;
  font-weight: bold;
}
nav button.active {
  background: var(--gold);
  color: #000;
}
main {
  max-width: 1200px;
  margin: auto;
  padding: 16px;
}
.section { display: none; }
.section.active { display: block; }
h2 {
  color: var(--gold);
  text-align: center;
}
#search {
  width: 100%;
  padding: 14px;
  margin: 12px 0 20px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #181818;
  color: #fff;
  font-size: 16px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 13px;
}
.product-card {
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: #fff;
  text-align: left;
}
.product-card:hover { border-color: var(--gold); }
.card-photo {
  width: 100%;
  height: 160px;
  object-fit: contain;
  background: #080808;
  display: block;
}
.card-info { padding: 12px; }
.card-info h3 {
  margin: 0 0 8px;
  font-size: 16px;
}
.price {
  color: var(--gold);
  font-size: 22px;
  font-weight: bold;
}
.detail {
  max-width: 760px;
  margin: auto;
}
.media-frame {
  background: #050505;
  border: 1px solid #292929;
  border-radius: 12px;
  overflow: hidden;
}
.main-media {
  display: block;
  width: 100%;
  height: min(70vw, 480px);
  object-fit: contain;
  background: #050505;
}
.thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}
.thumb {
  flex: 0 0 74px;
  width: 74px;
  height: 74px;
  padding: 0;
  border: 1px solid #555;
  border-radius: 7px;
  overflow: hidden;
  background: #111;
}
.thumb.active {
  border: 2px solid var(--gold);
}
.thumb img, .thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.panel {
  background: var(--panel);
  border: 1px solid #302b20;
  border-radius: 13px;
  padding: 18px;
  margin: 14px 0;
}
.panel-title {
  color: #b9ad8d;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.description {
  color: #ccc;
  line-height: 1.65;
  white-space: pre-wrap;
}
.variants {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.variant {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  text-align: left;
  padding: 14px;
  border: 1px solid #39332a;
  border-radius: 11px;
  background: #101010;
  color: #fff;
}
.variant.selected {
  border: 2px solid var(--gold);
  background: #292316;
}
.variant-price {
  color: var(--gold);
  font-weight: 900;
}
label {
  display: block;
  margin: 14px 0 7px;
}
select {
  width: 100%;
  padding: 12px;
  background: #101010;
  color: #fff;
  border: 1px solid #444;
  border-radius: 7px;
  font-size: 16px;
}
.gold-button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: var(--gold);
  color: #000;
  font-weight: bold;
  font-size: 16px;
}
.cart-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin: 10px 0;
}
.cart-item p { color: #ccc; }
.remove {
  background: transparent;
  color: #ff8d8d;
  border: 1px solid #844;
  padding: 8px 12px;
  border-radius: 6px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.gallery img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 1px solid #333;
  border-radius: 7px;
}
.whatsapp {
  display: block;
  margin: 18px 0;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: white;
  background: #128c4a;
  border-radius: 8px;
  font-weight: bold;
}
footer {
  margin-top: 30px;
  padding: 25px 10px;
  text-align: center;
  border-top: 1px solid #333;
  color: #999;
}
@media (max-width: 420px) {
  nav button { padding: 10px 9px; font-size: 12px; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .variants { gap: 8px; }
  .variant { padding: 10px; font-size: 14px; }
}
</style>
</head>

const reviewPhotos = Array.from(
  {length:30},
  (_,i) => "images/avis/avis" + (i+1) + ".jpg"
);

let cart = [];
let currentProduct = null;
let selectedVariant = 0;
let currentMedia = [];

function showSection(id, button) {
  document.querySelectorAll(".section").forEach(s =>
    s.classList.remove("active")
  );
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b =>
    b.classList.remove("active")
  );
  if (button) button.classList.add("active");

  if (id === "panier") renderCart();
  window.scrollTo({top:0, behavior:"smooth"});
}

function backToCatalogue() {
  showSection("catalogue", document.querySelector("nav button"));
}

function makeImg(src, alt) {
  const img = document.createElement("img");
  img.alt = alt;
  img.src = src;
  img.onerror = () => img.remove();
  return img;
}

function displayPrice(product) {
  return product.variants && product.variants.length
    ? product.variants[0].price
    : product.price;
}

function renderProducts() {
  const container = document.getElementById("products");
  const term = document.getElementById("search").value.trim().toLowerCase();
  container.replaceChildren();

  const matches = products.filter(p =>
    (p.name + " " + p.description).toLowerCase().includes(term)
  );

  if (!matches.length) {
    container.textContent = "Aucun produit trouvé.";
    return;
  }

  matches.forEach(product => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "product-card";
    button.onclick = () => openProduct(product.id);

    const photos = (product.photos || []).slice(0,4);
    const image = document.createElement("img");
    image.className = "card-photo";
    image.alt = product.name;

    if (photos.length) {
      image.src = photos[0];
      image.onerror = () => {
        image.style.display = "none";
      };
    } else {
      image.style.display = "none";
    }

    button.appendChild(image);

    const info = document.createElement("div");
    info.className = "card-info";

    const name = document.createElement("h3");
    name.textContent = product.name;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = displayPrice(product);

    info.append(name, price);
    button.appendChild(info);
    container.appendChild(button);
  });
}

function openProduct(id) {
  currentProduct = products.find(p => p.id === id);
  if (!currentProduct) return;

  selectedVariant = 0;

  const detail = document.getElementById("productDetail");
  detail.replaceChildren();
  currentMedia = [];

  (currentProduct.photos || []).slice(0,4).forEach(src => {
    currentMedia.push({type:"image", src});
  });

  (currentProduct.videos || []).forEach(src => {
    currentMedia.push({type:"video", src});
  });

  const frame = document.createElement("div");
  frame.className = "media-frame";

  if (currentMedia.length) {
    const holder = document.createElement("div");
    holder.id = "mainMediaHolder";
    frame.appendChild(holder);
    detail.appendChild(frame);
    renderMedia(0);

    if (currentMedia.length > 1) {
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";

      currentMedia.forEach((media, index) => {
        const button = document.createElement("button");
        button.className = "thumb" + (index === 0 ? " active" : "");

        button.onclick = () => {
          renderMedia(index);
          thumbs.querySelectorAll(".thumb").forEach((thumb, i) => {
            thumb.classList.toggle("active", i === index);
          });
        };

        if (media.type === "image") {
          button.appendChild(makeImg(media.src, "Miniature"));
        } else {
          const video = document.createElement("video");
          video.src = media.src;
          video.muted = true;
          video.preload = "metadata";
          button.appendChild(video);
        }

        thumbs.appendChild(button);
      });

      detail.appendChild(thumbs);
    }
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "main-media";
    placeholder.style.cssText =
      "display:grid;place-items:center;color:#888";
    placeholder.textContent = "Photos et vidéos à ajouter";
    frame.appendChild(placeholder);
    detail.appendChild(frame);
  }

  const price = document.createElement("div");
  price.className = "price";
  price.style.cssText =
    "font-size:clamp(30px,7vw,42px);margin:14px 0 22px";
  price.id = "detailPrice";
  price.textContent = displayPrice(currentProduct);
  detail.appendChild(price);

  const panel = document.createElement("div");
  panel.className = "panel";

  const panelTitle = document.createElement("div");
  panelTitle.className = "panel-title";
  panelTitle.textContent = "DÉTAILS DU PRODUIT";

  const description = document.createElement("p");
  description.className = "description";
  description.textContent = currentProduct.description;

  panel.append(panelTitle, description);
  detail.appendChild(panel);

  if (currentProduct.variants && currentProduct.variants.length) {
    const optionsPanel = document.createElement("div");
    optionsPanel.className = "panel";

    const title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = "CHOISIR UNE OPTION";
    optionsPanel.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "variants";
    grid.id = "variantGrid";

    currentProduct.variants.forEach((variant, index) => {
      const button = document.createElement("button");
      button.className = "variant" + (index === 0 ? " selected" : "");
      button.onclick = () => selectVariant(index);

      const label = document.createElement("span");
      label.textContent = variant.label;

      const price = document.createElement("span");
      price.className = "variant-price";
      price.textContent = variant.price;

      button.append(label, price);
      grid.appendChild(button);
    });

    optionsPanel.appendChild(grid);
    detail.appendChild(optionsPanel);
  }

  const quantityLabel = document.createElement("label");
  quantityLabel.textContent = "Quantité";
  detail.appendChild(quantityLabel);

  const quantity = document.createElement("select");
  quantity.id = "selectedQuantity";

  for (let n = 1; n <= 99; n++) {
    const option = document.createElement("option");
    option.value = n;
    option.textContent = n;
    quantity.appendChild(option);
  }

  detail.appendChild(quantity);

  const add = document.createElement("button");
  add.className = "gold-button";
  add.textContent = "AJOUTER AU PANIER";
  add.onclick = addToCart;
  detail.appendChild(add);

  showSection("detail", null);
}

function renderMedia(index) {
  const holder = document.getElementById("mainMediaHolder");
  if (!holder) return;

  holder.replaceChildren();
  const media = currentMedia[index];
  let element;

  if (media.type === "video") {
    element = document.createElement("video");
    element.controls = true;
    element.playsInline = true;
    element.preload = "metadata";
    element.src = media.src;
  } else {
    element = document.createElement("img");
    element.src = media.src;
    element.alt = currentProduct.name;
    element.onerror = () => {
      element.style.display = "none";
    };
  }

  element.className = "main-media";
  holder.appendChild(element);
}

function selectVariant(index) {
  selectedVariant = index;

  document.querySelectorAll("#variantGrid .variant").forEach((button, i) => {
    button.classList.toggle("selected", i === index);
  });

  document.getElementById("detailPrice").textContent =
    currentProduct.variants[index].price;
}

function addToCart() {
  if (!currentProduct) return;

  const quantity = Number(
    document.getElementById("selectedQuantity").value
  );

  const variant =
    currentProduct.variants && currentProduct.variants.length
      ? currentProduct.variants[selectedVariant]
      : null;

  const label = variant ? variant.label : "Standard";
  const price = variant ? variant.price : currentProduct.price;
  const key = currentProduct.id + "|" + label + "|" + price;

  const existing = cart.find(item => item.key === key);

  if (existing) {
    if (existing.quantity + quantity > 99) {
      alert("Maximum 99 par ligne.");
      return;
    }
    existing.quantity += quantity;
  } else {
    cart.push({
      key,
      name: currentProduct.name,
      variant: label,
      price,
      quantity
    });
  }

  updateCartCount();
  alert("Article ajouté au panier !");
}

function updateCartCount() {
  document.getElementById("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.quantity, 0);
}

function renderCart() {
  const container = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");
  container.replaceChildren();
  summary.replaceChildren();

  if (!cart.length) {
    container.textContent = "Ton panier est vide.";
    return;
  }

  cart.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "cart-item";

    const name = document.createElement("strong");
    name.textContent = item.name;

    const price = document.createElement("p");
    price.textContent =
      "Option : " + item.variant + " — Prix unitaire : " + item.price;

    const quantity = document.createElement("p");
    quantity.textContent = "Quantité : " + item.quantity;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Retirer";
    remove.onclick = () => {
      cart.splice(index, 1);
      updateCartCount();
      renderCart();
    };

    card.append(name, price, quantity, remove);
    container.appendChild(card);
  });

  const clear = document.createElement("button");
  clear.className = "gold-button";
  clear.textContent = "VIDER LE PANIER";
  clear.onclick = () => {
    if (confirm("Vider tout le panier ?")) {
      cart = [];
      updateCartCount();
      renderCart();
    }
  };

  summary.appendChild(clear);
}

function renderReviews() {
  const gallery = document.getElementById("reviewGallery");

  reviewPhotos.forEach(src => {
    const image = document.createElement("img");
    image.src = src;
    image.alt = "Retour client";
    image.loading = "lazy";
    image.onerror = () => image.remove();
    gallery.appendChild(image);
  });
}

renderProducts();
renderReviews();
</script>
</body>
</html>
