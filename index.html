<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>BOB LA MOULA 24/24</title>

<style>
:root {
  --gold: #f5c542;
  --bg: #090909;
  --card: #171717;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 24px 12px;
  background: #111;
  border-bottom: 1px solid #383838;
}
.logo {
  margin: 0;
  color: var(--gold);
  font-size: clamp(27px, 7vw, 42px);
  font-weight: 900;
  letter-spacing: 2px;
}
nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  padding: 12px 6px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 10;
}
button, a { cursor: pointer; }
nav button, .back, .outline {
  background: #171717;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 7px;
  padding: 11px 13px;
  font-weight: bold;
  text-decoration: none;
}
nav button.active, nav button:hover, .back:hover {
  background: var(--gold);
  color: #000;
}
main {
  max-width: 1200px;
  padding: 16px;
  margin: auto;
}
h2 { color: var(--gold); text-align: center; }
.section { display: none; }
.section.active { display: block; }
#search {
  width: 100%;
  padding: 14px;
  margin: 12px 0 20px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #181818;
  color: white;
  font-size: 16px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 13px;
}
.product-card {
  padding: 0;
  overflow: hidden;
  border: 1px solid #333;
  border-radius: 10px;
  background: var(--card);
  color: white;
  text-align: left;
}
.product-card:hover { border-color: var(--gold); }
.product-card img {
  width: 100%;
  height: 155px;
  object-fit: contain;
  background: #080808;
  display: block;
}
.card-info { padding: 12px; }
.card-info h3 { margin: 0 0 8px; font-size: 16px; }
.price {
  color: var(--gold);
  font-size: 20px;
  font-weight: bold;
}
.detail { max-width: 720px; margin: auto; }
.detail-photo {
  width: 100%;
  height: min(65vw, 400px);
  object-fit: contain;
  background: #111;
  border-radius: 10px;
}
.thumbnails {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}
.thumbnails img {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border: 1px solid #555;
  border-radius: 6px;
}
.description { color: #ccc; line-height: 1.6; white-space: pre-wrap; }
label { display: block; margin: 15px 0 7px; }
select {
  width: 100%;
  padding: 12px;
  background: #101010;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
  font-size: 16px;
}
.gold-button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: var(--gold);
  color: #000;
  font-weight: bold;
  font-size: 16px;
}
.empty { text-align: center; color: #bbb; padding: 25px 5px; }
.cart-item {
  background: var(--card);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 14px;
  margin: 10px 0;
}
.cart-item p { color: #ccc; }
.remove {
  background: transparent;
  color: #ff8d8d;
  border: 1px solid #844;
  padding: 8px 12px;
  border-radius: 6px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.gallery img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 1px solid #333;
  border-radius: 7px;
  background: #171717;
}
.whatsapp {
  display: block;
  margin: 18px 0;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: white;
  background: #128c4a;
  border-radius: 8px;
  font-weight: bold;
}
footer {
  margin-top: 30px;
  padding: 25px 10px;
  text-align: center;
  border-top: 1px solid #333;
  color: #999;
}
@media (max-width: 420px) {
  nav button { padding: 10px 9px; font-size: 12px; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<header>
  <h1 class="logo">BOB LA MOULA</h1>
  <div style="color:#aaa;margin-top:8px">24/24</div>
</header>

<nav>
  <button class="active" onclick="showSection('catalogue',this)">MENU</button>
  <button onclick="showSection('panier',this)">
    PANIER (<span id="cartCount">0</span>)

  <button onclick="showSection('avis',this)">RETOURS CLIENTS</button>

</nav>

<main>
  <section id="catalogue" class="section active">
    <h2>MENU</h2>
    <input id="search" type="search"
      placeholder="Rechercher un produit..."

    <div id="products" class="products"></div>
  </section>

  <section id="detail" class="section">
    <button class="back" onclick="backToCatalogue()">← Retour au menu</button>
    <div id="productDetail" class="detail"></div>
  </section>

  <section id="panier" class="section">
    <h2>MON PANIER</h2>
    <div id="cartItems"></div>
    <div id="cartSummary"></div>
  </section>

  <section id="avis" class="section">
    <h2>RETOURS CLIENTS</h2>
    <p class="description">
      Retrouvez ici les photos des retours clients.
    </p>
    <div id="reviewGallery" class="gallery"></div>
  </section>

  <section id="informations" class="section">
    <h2>NOUS CONTACTER</h2>
    <p class="description">
      Pour toute question concernant la boutique, contacte-nous directement sur WhatsApp en cliquant sur le bouton ci-dessous.
    </p>

       href="https://wa.me/33653430135"
       target="_blank"
       rel="noopener noreferrer">
      CONTACTER SUR WHATSAPP
    </a>
  </section>
</main>

<footer>BOB LA MOULA 24/24</footer>

    price: "PRIX 52",
    description: "DESCRIPTION DU PRODUIT 52",
    photos: ["images/produit52-1.jpg", "images/produit52-2.jpg", "images/produit52-3.jpg", "images/produit52-4.jpg"],
    weight: true
  },
  {
    id: 53,
    name: "NOM DU PRODUIT 53",
    price: "PRIX 53",
    description: "DESCRIPTION DU PRODUIT 53",
    photos: ["images/produit53-1.jpg", "images/produit53-2.jpg", "images/produit53-3.jpg", "images/produit53-4.jpg"],
    weight: true
  },
  {
    id: 54,
    name: "NOM DU PRODUIT 54",
    price: "PRIX 54",
    description: "DESCRIPTION DU PRODUIT 54",
    photos: ["images/produit54-1.jpg", "images/produit54-2.jpg", "images/produit54-3.jpg", "images/produit54-4.jpg"],
    weight: true
  },
  {
    id: 55,
    name: "NOM DU PRODUIT 55",
    price: "PRIX 55",
    description: "DESCRIPTION DU PRODUIT 55",
    photos: ["images/produit55-1.jpg", "images/produit55-2.jpg", "images/produit55-3.jpg", "images/produit55-4.jpg"],
    weight: true
  }
];

const weights = [
  "300 g", "500 g", "100 g", "800 g", "950 g",
  "1 kg", "2 kg", "3 kg", "4 kg"
];

/* Galerie de 30 photos : ajoute les fichiers dans images/avis/ */
const reviewPhotos = Array.from(
  { length: 30 },
  (_, i) => "images/avis/avis" + (i + 1) + ".jpg"
);

/* Panier temporaire dans la session de navigation */
let cart = [];
let currentProduct = null;

function showSection(id, button) {
  document.querySelectorAll(".section").forEach(section =>
    section.classList.remove("active")
  );
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn =>
    btn.classList.remove("active")
  );
  if (button) button.classList.add("active");

  if (id === "panier") renderCart();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToCatalogue() {
  showSection("catalogue", document.querySelector("nav button"));
}

function makeImage(src, className, alt) {
  const img = document.createElement("img");
  img.className = className;
  img.alt = alt;
  if (src) img.src = src;
  img.onerror = () => {
    img.style.display = "none";
  };
  return img;
}

function renderProducts() {
  const container = document.getElementById("products");
  const term = document.getElementById("search").value
    .trim().toLowerCase();
  container.replaceChildren();

  const matches = products.filter(p =>
    (p.name + " " + p.description).toLowerCase().includes(term)
  );

  if (!matches.length) {
    container.textContent = "Aucun produit trouvé.";
    return;
  }

  matches.forEach(product => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "product-card";
    button.onclick = () => openProduct(product.id);

    const photos = (product.photos || []).slice(0, 4);
    button.appendChild(makeImage(photos[0] || "", "", product.name));

    const info = document.createElement("div");
    info.className = "card-info";

    const name = document.createElement("h3");
    name.textContent = product.name;
    info.appendChild(name);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price;
    info.appendChild(price);

    button.appendChild(info);
    container.appendChild(button);
  });
}

function openProduct(id) {
  const product = products.find(p => p.id === id);
  if (!product) return;
  currentProduct = product;

  const detail = document.getElementById("productDetail");
  detail.replaceChildren();

  const photos = (product.photos || []).slice(0, 4);
  const mainPhoto = makeImage(
    photos[0] || "", "detail-photo", product.name
  );
  detail.appendChild(mainPhoto);

  if (photos.length > 1) {
    const thumbs = document.createElement("div");
    thumbs.className = "thumbnails";

    photos.forEach(photo => {
      const thumb = makeImage(photo, "", "Photo supplémentaire");
      thumb.style.display = "block";
      thumb.onclick = () => {
        mainPhoto.src = photo;
        mainPhoto.style.display = "block";
      };
      thumbs.appendChild(thumb);
    });
    detail.appendChild(thumbs);
  }

  const title = document.createElement("h2");
  title.textContent = product.name;
  title.style.textAlign = "left";
  detail.appendChild(title);

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = product.price;
  detail.appendChild(price);

  const description = document.createElement("p");
  description.className = "description";
  description.textContent = product.description;
  detail.appendChild(description);

  const quantityLabel = document.createElement("label");
  quantityLabel.textContent = "Quantité";
  detail.appendChild(quantityLabel);

  const quantity = document.createElement("select");
  quantity.id = "selectedQuantity";
  for (let n = 1; n <= 99; n++) {
    const option = document.createElement("option");
    option.value = n;
    option.textContent = n;
    quantity.appendChild(option);
  }
  detail.appendChild(quantity);

  if (product.weight) {
    const label = document.createElement("label");
    label.textContent = "Poids";
    detail.appendChild(label);

    const select = document.createElement("select");
    select.id = "selectedWeight";

    weights.forEach(weight => {
      const option = document.createElement("option");
      option.value = weight;
      option.textContent = weight;
      select.appendChild(option);
    });
    detail.appendChild(select);
  }

  const add = document.createElement("button");
  add.className = "gold-button";
  add.textContent = "AJOUTER AU PANIER";
  add.onclick = addToCart;
  detail.appendChild(add);

  showSection("detail", null);
}

function addToCart() {
  if (!currentProduct) return;

  const quantity = Number(
    document.getElementById("selectedQuantity").value
  );
  const weightElement = document.getElementById("selectedWeight");
  const weight = weightElement ? weightElement.value : "Non applicable";

  const existing = cart.find(item =>
    item.id === currentProduct.id && item.weight === weight
  );

  if (existing) {
    if (existing.quantity + quantity > 99) {
      alert("La quantité maximale par ligne est de 99.");
      return;
    }
    existing.quantity += quantity;
  } else {
    cart.push({
      id: currentProduct.id,
      name: currentProduct.name,
      price: currentProduct.price,
      weight,
      quantity
    });
  }

  updateCartCount();
  alert("Article ajouté au panier !");
}

function updateCartCount() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById("cartCount").textContent = count;
}

function renderCart() {
  const container = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");
  container.replaceChildren();
  summary.replaceChildren();

  if (!cart.length) {
    container.textContent = "Ton panier est vide.";
    return;
  }

  cart.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "cart-item";

    const name = document.createElement("strong");
    name.textContent = item.name;
    card.appendChild(name);

    const price = document.createElement("p");
    price.textContent = "Prix unitaire : " + item.price;
    card.appendChild(price);

    const details = document.createElement("p");
    details.textContent =
      "Quantité : " + item.quantity + " — Poids : " + item.weight;
    card.appendChild(details);

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Retirer";
    remove.onclick = () => {
      cart.splice(index, 1);
      updateCartCount();
      renderCart();
    };
    card.appendChild(remove);

    container.appendChild(card);
  });

  const clear = document.createElement("button");
  clear.className = "gold-button";
  clear.textContent = "VIDER LE PANIER";
  clear.onclick = () => {
    if (confirm("Vider tout le panier ?")) {
      cart = [];
      updateCartCount();
      renderCart();
    }
  };
  summary.appendChild(clear);
}

/* Afficher les photos disponibles parmi les 30 emplacements */
function renderReviewGallery() {
  const gallery = document.getElementById("reviewGallery");

  reviewPhotos.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Retour client";
    img.loading = "lazy";
    img.onerror = () => img.remove();
    gallery.appendChild(img);
  });
}

renderProducts();
renderReviewGallery();
</script>
