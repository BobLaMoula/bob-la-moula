<style>
:root {
  --or: #f5c542;
  --fond: #090909;
  --carte: #171717;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--or);
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 28px 12px;
  border-bottom: 1px solid #8d6c1e;
  background: #111;
}
header h1 {
  margin: 0;
  font-size: clamp(25px, 6vw, 38px);
}
header p { color: #eee; }
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 8px;
}
button {
  cursor: pointer;
  background: #171717;
  color: var(--or);
  border: 1px solid var(--or);
  border-radius: 8px;
  padding: 11px 14px;
  font-weight: bold;
}
button:hover { background: #30250b; }
main {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 14px;
}
h2 { font-size: 23px; }
#products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.product {
  min-width: 0;
  padding: 10px;
  background: var(--carte);
  border: 1px solid #8d6c1e;
  border-radius: 12px;
  overflow: hidden;
}
.main-photo {
  height: 180px;
  width: 100%;
  background: #080808;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.main-photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.no-photo {
  color: #aaa;
  text-align: center;
  font-size: 13px;
  padding: 10px;
}
.thumbnails {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0;
}
.thumbnails img {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  object-fit: cover;
  border: 1px solid var(--or);
  border-radius: 5px;
  cursor: pointer;
}
.product h3 {
  color: white;
  font-size: 17px;
  overflow-wrap: anywhere;
}
.price {
  font-size: 18px;
  font-weight: bold;
  margin: 8px 0;
}
.description {
  color: #ddd;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.panel {
  display: none;
  color: #eee;
  line-height: 1.6;
  padding: 10px;
}
footer {
  text-align: center;
  color: #aaa;
  padding: 25px 10px;
  font-size: 12px;
}
@media (min-width: 700px) {
  #products { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  #products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 360px) {
  #products { gap: 7px; }
  .product { padding: 7px; }
  .main-photo { height: 140px; }
}
</style>

function showSection(sectionId) {
  document.getElementById("catalogue").style.display =
    sectionId === "catalogue" ? "block" : "none";

  document.getElementById("infos").style.display =
    sectionId === "infos" ? "block" : "none";

  document.getElementById("avis").style.display =
    sectionId === "avis" ? "block" : "none";

  window.scrollTo({top: 0, behavior: "smooth"});
}

function renderProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach((product, index) => {
    const card = document.createElement("article");
    card.className = "product";

    const photoArea = document.createElement("div");
    photoArea.className = "main-photo";

    const thumbnails = document.createElement("div");
    thumbnails.className = "thumbnails";

    // LIMITE STRICTE : 4 PHOTOS MAXIMUM
    const photos = Array.isArray(product.photos)
      ? product.photos
          .filter(photo =>
            typeof photo === "string" && photo.trim() !== ""
          )
          .slice(0, 4)
      : [];

    function showPhoto(path) {
      photoArea.innerHTML = "";

      const img = document.createElement("img");
      img.src = path;
      img.alt = product.name || ("Article " + (index + 1));

      img.onerror = function() {
        photoArea.innerHTML = "";
        const message = document.createElement("div");
        message.className = "no-photo";
        message.textContent = "Photo à ajouter";
        photoArea.appendChild(message);
      };

      photoArea.appendChild(img);
    }

    if (photos.length > 0) {
      showPhoto(photos[0]);

      photos.forEach((path, photoIndex) => {
        const thumb = document.createElement("img");
        thumb.src = path;
        thumb.alt = "Photo " + (photoIndex + 1);
        thumb.onerror = function() {
          thumb.style.display = "none";
        };
        thumb.addEventListener("click", () => showPhoto(path));
        thumbnails.appendChild(thumb);
      });
    } else {
      const message = document.createElement("div");
      message.className = "no-photo";
      message.textContent = "Photo à ajouter";
      photoArea.appendChild(message);
    }

    const title = document.createElement("h3");
    title.textContent = product.name || ("Article " + (index + 1));

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price || "Prix à renseigner";

    const description = document.createElement("p");
    description.className = "description";
    description.textContent =
      product.description || "Description à renseigner.";

    card.appendChild(photoArea);

    if (photos.length > 1) {
      card.appendChild(thumbnails);
    }

    card.appendChild(title);
    card.appendChild(price);
    card.appendChild(description);
    container.appendChild(card);
  });
}
