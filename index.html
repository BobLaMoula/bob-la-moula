
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>BOB LA MOULA 24/24</title>

<style>
:root {
  --gold: #f5c542;
  --bg: #090909;
  --card: #171717;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 24px 12px;
  background: #111;
  border-bottom: 1px solid #383838;
}
.logo {
  margin: 0;
  color: var(--gold);
  font-size: clamp(28px, 7vw, 42px);
  font-weight: 900;
  letter-spacing: 2px;
}
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 5;
}
button {
  cursor: pointer;
  font-weight: bold;
}
nav button, .back-button {
  padding: 11px 16px;
  border: 1px solid var(--gold);
  border-radius: 7px;
  background: #171717;
  color: var(--gold);
}
nav button.active, nav button:hover,
.back-button:hover {
  background: var(--gold);
  color: #000;
}
main {
  width: min(1200px, 100%);
  padding: 16px;
  margin: auto;
}
h2 {
  color: var(--gold);
  text-align: center;
}
#search {
  width: 100%;
  padding: 14px;
  margin: 12px 0 20px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #181818;
  color: white;
  font-size: 16px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 13px;
}
.product-card {
  overflow: hidden;
  border: 1px solid #333;
  border-radius: 10px;
  background: var(--card);
  color: white;
  text-align: left;
  padding: 0;
  width: 100%;
}
.product-card:hover {
  border-color: var(--gold);
}
.product-card img {
  width: 100%;
  height: 155px;
  object-fit: contain;
  background: #080808;
  display: block;
}
.card-info {
  padding: 12px;
}
.card-info h3 {
  margin: 0 0 8px;
  font-size: 16px;
}
.price {
  color: var(--gold);
  font-size: 20px;
  font-weight: bold;
}
.detail {
  max-width: 700px;
  margin: auto;
}
.detail h2 {
  text-align: left;
}
.detail-main-photo {
  display: block;
  width: 100%;
  height: min(65vw, 400px);
  object-fit: contain;
  background: #111;
  border-radius: 10px;
}
.thumbnails {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 10px 0;
}
.thumbnails img {
  width: 75px;
  height: 75px;
  object-fit: cover;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  cursor: pointer;
}
.detail-price {
  color: var(--gold);
  font-size: 27px;
  font-weight: bold;
  margin: 15px 0;
}
.description {
  color: #ccc;
  line-height: 1.6;
  white-space: pre-wrap;
}
label {
  display: block;
  margin: 16px 0 7px;
}
select {
  width: 100%;
  padding: 13px;
  background: #101010;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
  font-size: 16px;
}
.section { display: none; }
.section.active { display: block; }
.empty {
  grid-column: 1 / -1;
  color: #bbb;
  text-align: center;
  padding: 30px 8px;
}
footer {
  margin-top: 30px;
  padding: 25px 10px;
  text-align: center;
  border-top: 1px solid #333;
  color: #999;
}
</style>
</head>

<body>
<header>
  <h1 class="logo">BOB LA MOULA</h1>
  <div style="color:#aaa;margin-top:8px">24/24</div>
</header>

<nav>
  <button class="active" onclick="showSection('catalogue',this)">MENU</button>
  <button onclick="showSection('informations',this)">INFORMATIONS</button>
  <button onclick="showSection('avis',this)">RETOURS CLIENTS</button>
</nav>

<main>
  <section id="catalogue" class="section active">
    <h2>MENU</h2>
    <input id="search" type="search"
      placeholder="Rechercher un produit..."
      oninput="renderProducts()">
    <div id="products" class="products"></div>
  </section>

  <section id="detail" class="section">
    <button class="back-button" onclick="backToCatalogue()">
      ← Retour aux produits
    </button>
    <div id="productDetail" class="detail"></div>
  </section>

  <section id="informations" class="section">
    <h2>INFORMATIONS</h2>
    <p>BOB LA MOULA 24/24</p>
  </section>

  <section id="avis" class="section">
    <h2>RETOURS CLIENTS</h2>
    <p>Retours clients</p>
  </section>
</main>

<footer>BOB LA MOULA 24/24</footer>

<script>
/*
  CATALOGUE DE 55 PRODUITS

  Pour chaque article, renseigne :
  name        : nom du produit
  price       : prix affiché
  description : description
  photos      : jusqu'à 4 chemins de photos
  weight      : true pour afficher le choix du poids
*/

const products = Array.from({ length: 55 }, (_, i) => ({
  id: i + 1,
  name: "Produit " + (i + 1),
  price: "Prix à définir",
  description: "Description à compléter.",
  photos: [],
  weight: true
}));

// EXEMPLE : pour modifier le premier produit, remplace ses données ici.
products[0] = {
  id: 1,
  name: "Produit 1",
  price: "Prix à définir",
  description: "Ajoute ici la description du produit.",
  photos: [
    "images/produit1.jpg",
    "images/produit1-2.jpg",
    "images/produit1-3.jpg",
    "images/produit1-4.jpg"
  ],
  weight: true
};

const weights = [
  "300 g",
  "500 g",
  "100 g",
  "800 g",
  "950 g",
  "1 kg",
  "2 kg",
  "3 kg",
  "4 kg"
];

function showSection(id, button) {
  document.querySelectorAll(".section").forEach(section => {
    section.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
  });
  if (button) button.classList.add("active");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function makeImage(src, className, alt) {
  const img = document.createElement("img");
  img.className = className;
  img.alt = alt;
  if (src) img.src = src;
  img.onerror = () => {
    img.removeAttribute("src");
    img.alt = "Photo à ajouter";
  };
  return img;
}

function renderProducts() {
  const container = document.getElementById("products");
  const term = document.getElementById("search").value
    .trim().toLowerCase();

  container.replaceChildren();

  const matches = products.filter(product =>
    (product.name + " " + product.description)
      .toLowerCase().includes(term)
  );

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Aucun produit trouvé.";
    container.appendChild(empty);
    return;
  }

  matches.forEach(product => {
    const button = document.createElement("button");
    button.className = "product-card";
    button.type = "button";
    button.onclick = () => openProduct(product.id);

    const photos = (product.photos || []).slice(0, 4);
    const image = makeImage(
      photos[0] || "",
      "",
      product.name
    );
    button.appendChild(image);

    const info = document.createElement("div");
    info.className = "card-info";

    const title = document.createElement("h3");
    title.textContent = product.name;
    info.appendChild(title);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price;
    info.appendChild(price);

    button.appendChild(info);
    container.appendChild(button);
  });
}

function openProduct(id) {
  const product = products.find(item => item.id === id);
  if (!product) return;

  const detail = document.getElementById("productDetail");
  detail.replaceChildren();

  const photos = (product.photos || []).slice(0, 4);
  const mainPhoto = makeImage(
    photos[0] || "",
    "detail-main-photo",
    product.name
  );
  detail.appendChild(mainPhoto);

  if (photos.length > 1) {
    const thumbs = document.createElement("div");
    thumbs.className = "thumbnails";

    photos.forEach(photo => {
      const thumb = makeImage(photo, "", "Photo supplémentaire");
      thumb.onclick = () => {
        mainPhoto.src = photo;
        mainPhoto.style.display = "block";
      };
      thumbs.appendChild(thumb);
    });
    detail.appendChild(thumbs);
  }

  const title = document.createElement("h2");
  title.textContent = product.name;
  detail.appendChild(title);

  const price = document.createElement("div");
  price.className = "detail-price";
  price.textContent = product.price;
  detail.appendChild(price);

  const description = document.createElement("p");
  description.className = "description";
  description.textContent = product.description;
  detail.appendChild(description);

  const quantityLabel = document.createElement("label");
  quantityLabel.textContent = "Quantité";
  detail.appendChild(quantityLabel);

  const quantity = document.createElement("select");
  for (let n = 1; n <= 99; n++) {
    const option = document.createElement("option");
    option.value = String(n);
    option.textContent = String(n);
    quantity.appendChild(option);
  }
  detail.appendChild(quantity);

  if (product.weight) {
    const weightLabel = document.createElement("label");
    weightLabel.textContent = "Poids";
    detail.appendChild(weightLabel);

    const weightSelect = document.createElement("select");
    weights.forEach(weight => {
      const option = document.createElement("option");
      option.value = weight;
      option.textContent = weight;
      weightSelect.appendChild(option);
    });
    detail.appendChild(weightSelect);
  }

  showSection("detail", null);
}

function backToCatalogue() {
  showSection(
    "catalogue",
    document.querySelector("nav button")
  );
}

renderProducts();
</script>
</body>
</html>
