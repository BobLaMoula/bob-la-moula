
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>BOB LA MOULA 24/24</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #111;
  border-bottom: 1px solid #3a3a3a;
}

.logo {
  margin: 0;
  color: #f5c542;
  font-size: clamp(28px, 7vw, 42px);
  font-weight: 900;
  letter-spacing: 2px;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav button {
  background: #181818;
  color: #f5c542;
  border: 1px solid #f5c542;
  border-radius: 7px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
}

nav button.active,
nav button:hover {
  background: #f5c542;
  color: #000;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 16px;
}

.section { display: none; }
.section.active { display: block; }

h2 {
  text-align: center;
  color: #f5c542;
}

#search {
  width: 100%;
  padding: 14px;
  margin: 10px 0 20px;
  background: #181818;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

.product {
  overflow: hidden;
  border: 1px solid #333;
  background: #171717;
  border-radius: 12px;
}

.main-photo {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #080808;
}

.thumbnails {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 8px;
}

.thumbnails img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border: 1px solid #555;
  border-radius: 5px;
}

.product-content { padding: 14px; }

.product h3 {
  margin: 0 0 10px;
  font-size: 19px;
}

.price {
  color: #f5c542;
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
}

.description {
  color: #ccc;
  line-height: 1.5;
  white-space: pre-wrap;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #ddd;
}

select {
  width: 100%;
  padding: 12px;
  border: 1px solid #444;
  border-radius: 7px;
  background: #090909;
  color: white;
  font-size: 16px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px;
  color: #bbb;
}

footer {
  text-align: center;
  padding: 25px 10px;
  margin-top: 30px;
  border-top: 1px solid #333;
  color: #999;
}
</style>
</head>

<body>

<header>
  <h1 class="logo">BOB LA MOULA</h1>
  <div style="color:#aaa;margin-top:8px">24/24</div>
</header>

<nav>
  <button id="menuButton" class="active"
    onclick="showSection('catalogue', this)">MENU</button>
  <button onclick="showSection('informations', this)">INFORMATIONS</button>
  <button onclick="showSection('avis', this)">RETOURS CLIENTS</button>
</nav>

<main>

  <section id="catalogue" class="section active">
    <h2>MENU</h2>

    <input
      id="search"
      type="search"
      placeholder="Rechercher un produit..."
      oninput="renderProducts()"
    >

    <div id="products" class="products"></div>
  </section>

  <section id="informations" class="section">
    <h2>INFORMATIONS</h2>
    <p style="text-align:center;color:#ccc">
      BOB LA MOULA 24/24
    </p>
  </section>

  <section id="avis" class="section">
    <h2>RETOURS CLIENTS</h2>
    <p style="text-align:center;color:#ccc">
      Retours clients
    </p>
  </section>

</main>

<footer>BOB LA MOULA 24/24</footer>

<script>

/*
  AJOUTER DES PRODUITS :
  Modifie la liste ci-dessous.
  Mets jusqu'à 4 photos par produit.
  Les photos doivent exister dans ton dépôt GitHub.
*/

const products = [
  {
    name: "Produit 1",
    price: "Prix à définir",
    description: "Description du produit.",
    photos: [
      "images/produit1.jpg",
      "images/produit1-2.jpg",
      "images/produit1-3.jpg",
      "images/produit1-4.jpg"
    ],
    weight: true
  },
  {
    name: "Produit 2",
    price: "Prix à définir",
    description: "Description du produit.",
    photos: [],
    weight: true
  }

  /*
  Ajoute les autres produits en copiant ce modèle :

  ,{
    name: "Produit 3",
    price: "15,00 €",
    description: "Description du produit",
    photos: ["images/produit3.jpg"],
    weight: true
  }
  */
];

const weights = [
  "300 g",
  "500 g",
  "100 g",
  "800 g",
  "950 g",
  "1 kg",
  "2 kg",
  "3 kg",
  "4 kg"
];

function showSection(id, button) {
  document.querySelectorAll(".section").forEach(section => {
    section.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderProducts() {
  const container = document.getElementById("products");
  const search = document.getElementById("search")
    .value.trim().toLowerCase();

  const filtered = products.filter(product =>
    (product.name + " " + product.description)
      .toLowerCase().includes(search)
  );

  container.replaceChildren();

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Aucun produit trouvé.";
    container.appendChild(empty);
    return;
  }

  filtered.forEach(product => {
    const card = document.createElement("article");
    card.className = "product";

    const photos = (product.photos || [])
      .filter(photo => typeof photo === "string" && photo.trim())
      .slice(0, 4);

    const mainPhoto = document.createElement("img");
    mainPhoto.className = "main-photo";
    mainPhoto.alt = product.name;
    mainPhoto.src = photos[0] || "";
    mainPhoto.onerror = () => mainPhoto.style.display = "none";

    card.appendChild(mainPhoto);

    if (photos.length > 1) {
      const thumbs = document.createElement("div");
      thumbs.className = "thumbnails";

      photos.forEach(photo => {
        const img = document.createElement("img");
        img.src = photo;
        img.alt = "Photo du produit";
        img.onclick = () => {
          mainPhoto.src = photo;
          mainPhoto.style.display = "block";
        };
        thumbs.appendChild(img);
      });

      card.appendChild(thumbs);
    }

    const content = document.createElement("div");
    content.className = "product-content";

    const title = document.createElement("h3");
    title.textContent = product.name;
    content.appendChild(title);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price || "Prix à définir";
    content.appendChild(price);

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = product.description || "";
    content.appendChild(description);

    const quantityLabel = document.createElement("label");
    quantityLabel.textContent = "Quantité";
    content.appendChild(quantityLabel);

    const quantity = document.createElement("select");

    for (let i = 1; i <= 99; i++) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = String(i);
      quantity.appendChild(option);
    }

    content.appendChild(quantity);

    if (product.weight) {
      const weightLabel = document.createElement("label");
      weightLabel.textContent = "Choisir le poids";
      content.appendChild(weightLabel);

      const weightSelect = document.createElement("select");

      weights.forEach(weight => {
        const option = document.createElement("option");
        option.value = weight;
        option.textContent = weight;
        weightSelect.appendChild(option);
      });

      content.appendChild(weightSelect);
    }

    card.appendChild(content);
    container.appendChild(card);
  });
}

renderProducts();

</script>
</body>
</html>
